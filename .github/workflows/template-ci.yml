# Template CI — renders this Copier template under many presets and runs every
# generated-project gate (see template-tests/check.py). This is the template's
# OWN certification; generated projects get their own CI under project/.github/.
name: template-ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: the harness only reads the repo.
permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    steps:
      # Supply-chain: actions are pinned to full commit SHAs because movable tags
      # are mutable. persist-credentials:false keeps the checkout token off disk
      # while later steps run.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0          # copier update / tags need full history
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"  # matches the template's environment.yml

      # LaTeX (manuscript + beamer, built with XeLaTeX) + a broad Unicode font
      # (Noto CJK) so the CJK-title preset's latex_build succeeds.
      - name: Install LaTeX + fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-base texlive-latex-recommended \
            texlive-latex-extra texlive-fonts-recommended \
            texlive-xetex fonts-noto-cjk
          sudo fc-cache -f

      # Render-time toolchain the harness requires on PATH. Generated projects
      # pip-install their own library deps via `pip install -e .`; these are the
      # tools the harness itself invokes across all rendered projects.
      - name: Install render toolchain
        run: |
          python -m pip install --upgrade pip pipx
          pip install \
            "setuptools>=68" wheel \
            "copier>=9" jinja2-time \
            "snakemake>=8" snakemake-executor-plugin-slurm \
            "dvc>=3,<4" \
            pre-commit \
            sphinx myst-nb furo numpydoc \
            mkdocs-material mkdocs-jupyter \
            "PyYAML==6.0.2" "jsonschema==4.23.0" \
            black isort ruff mypy interrogate pillow
          # cffconvert 2.0.0 pins jsonschema<4, while the program-control
          # registry validator requires Draft 2020-12 from jsonschema 4.x.
          # Isolate the CLI so both validators use their supported dependency
          # sets instead of forcing pip into an unsatisfiable shared solve.
          python -m pipx install cffconvert==2.0.0
          echo "$(python -m site --user-base)/bin" >> "$GITHUB_PATH"

      - name: Certify template (all presets + special)
        run: python template-tests/check.py

      - name: Upload gate summary
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: harness-summary
          path: /tmp/harness_summary.json
          if-no-files-found: ignore
